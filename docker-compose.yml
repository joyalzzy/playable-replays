services:
  model:
    image: playable-replays-unit-policy
    expose:
      - "9000"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      FIXTURE_PATH: /app/fixtures/moments.json
      BOT_MODEL_URL: ${BOT_MODEL_URL:-http://model:9000/v1/actions}
      BOT_MODEL_NAME: ${BOT_MODEL_NAME:-playable-replays-linear-unit-policy}
      BOT_MODEL_VERSION: ${BOT_MODEL_VERSION:-unit-policy-v2-carry-safety}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      model:
        condition: service_healthy

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_TARGET: http://api:8080
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
