openapi: 3.1.0
info:
  title: Playable Replays API
  version: 1.1.0
  description: |
    Core API for the deterministic, full-map MOBA tactical-board prototype.
    Dodge and player-directed projectile fire are separate two-charge reactions
    and are not tactical actions. The optional schema 2.0 bot bridge is
    non-authoritative; any bridge failure causes the Go simulator to use its
    deterministic fallback.
servers:
  - url: http://127.0.0.1:8080
    description: Local Go API
security: []
tags:
  - name: Health
  - name: Moments
  - name: Sessions
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: health
      summary: Check API liveness
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/moments:
    get:
      tags: [Moments]
      operationId: listMoments
      summary: List the one to three playable replay moments
      responses:
        "200":
          description: Available moments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentsResponse"
  /api/v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Create an in-memory simulator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get current simulator state
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}/turns:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Sessions]
      operationId: takeTurn
      summary: Resolve one tactical action
      description: |
        Accepts move, hold, contest, or retreat. Move requires a point target.
        Contest may identify a visible enemy already inside the controlled
        unit's attack range. The simulator then resolves bot actions,
        projectiles, damage, objectives, visibility, scoring, and terminal state
        in authoritative order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnRequest"
      responses:
        "200":
          description: Resolved session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}/fire:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Sessions]
      operationId: fireProjectile
      summary: Spend one projectile charge on a marksman shot
      description: |
        Queues a one-turn projectile from the selected live blue marksman to a
        visible enemy inside that marksman's attack range. This reaction does
        not advance the tactical turn. A session has two projectile charges;
        cooldown, range, visibility, source class, and target team are validated
        authoritatively.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FireProjectileRequest"
      responses:
        "200":
          description: Projectile queued and updated state returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}/dodge:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Sessions]
      operationId: dodgeProjectile
      summary: Spend one Dodge charge on an incoming projectile
      description: |
        This reaction does not advance the turn and has no request body. It is
        available only while a projectile targets the controlled unit and one
        of the scenario's two Dodge charges remains.
      responses:
        "200":
          description: Projectile dodged and updated state returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}/reset:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Sessions]
      operationId: resetSession
      summary: Reset a session to its deterministic fixture seed
      responses:
        "200":
          description: Reset session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
webhooks:
  botActionRequest:
    post:
      operationId: requestBotActions
      summary: Request advisory NPC actions from the configured model bridge
      description: |
        The Go backend sends this privileged schema 2.0 snapshot to its
        operator-configured bridge, conventionally POST /v1/actions. The bridge
        must return exactly one action for every live non-controlled unit.
        Unknown, duplicate, controlled, defeated, omitted, or invalid units
        invalidate the complete response and activate deterministic fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotModelRequest"
      responses:
        "200":
          description: Complete advisory action set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotModelResponse"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Process-local session ID.
      schema:
        type: string
        minLength: 1
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Per-session mutation limit exceeded
      headers:
        Retry-After:
          description: Minimum seconds before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
      required: [status]
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
          required: [code, message]
      required: [error]
    Point:
      type: object
      additionalProperties: false
      properties:
        x:
          type: number
          minimum: 0
          maximum: 100
        y:
          type: number
          minimum: 0
          maximum: 100
      required: [x, y]
    MapBounds:
      type: object
      additionalProperties: false
      properties:
        minX:
          type: number
          const: 0
        maxX:
          type: number
          const: 100
        minY:
          type: number
          const: 0
        maxY:
          type: number
          const: 100
      required: [minX, maxX, minY, maxY]
    ActionType:
      type: string
      enum: [move, hold, contest, retreat]
    Action:
      oneOf:
        - $ref: "#/components/schemas/MoveAction"
        - $ref: "#/components/schemas/SimpleAction"
    MoveAction:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: move
        target:
          $ref: "#/components/schemas/Point"
      required: [type, target]
    SimpleAction:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [hold, contest, retreat]
      required: [type]
    TurnRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          $ref: "#/components/schemas/Action"
        targetUnitId:
          type: string
          minLength: 1
          description: Optional visible in-range enemy selected for contest.
      required: [action]
    FireProjectileRequest:
      type: object
      additionalProperties: false
      properties:
        sourceUnitId:
          type: string
          minLength: 1
        targetUnitId:
          type: string
          minLength: 1
      required: [sourceUnitId, targetUnitId]
    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        momentId:
          type: string
          minLength: 1
      required: [momentId]
    MomentsResponse:
      type: object
      additionalProperties: false
      properties:
        moments:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/MomentSummary"
      required: [moments]
    MomentSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        map:
          type: string
          minLength: 1
        category:
          type: string
          enum: [objective-contest, team-fight-engagement, escape, positioning, resource-trade, vision-uncertainty]
        skillLevel:
          type: string
          enum: [beginner, intermediate, advanced]
        reasonTags:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        highlightScore:
          type: number
          minimum: 0
          maximum: 1
      required: [id, slug, title, description, map, category, skillLevel, reasonTags, highlightScore]
    UnitClass:
      type: string
      enum: [tank, fighter, marksman, mage, support, assassin]
    Unit:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        team:
          type: string
          enum: [blue, red]
        role:
          type: string
          minLength: 1
        class:
          $ref: "#/components/schemas/UnitClass"
        policy:
          type: string
          enum: [controlled, support, protector, aggressive, skirmisher]
        position:
          $ref: "#/components/schemas/Point"
        hp:
          type: integer
          minimum: 0
        maxHp:
          type: integer
          minimum: 1
        moveRange:
          type: number
          minimum: 0
          maximum: 100
        attackRange:
          type: number
          minimum: 0
          maximum: 100
        attackDamage:
          type: integer
          minimum: 1
        moveSpeed:
          type: number
          minimum: 0
        armor:
          type: integer
          minimum: 0
        visionRange:
          type: number
          exclusiveMinimum: 0
        attackCooldown:
          type: integer
          minimum: 1
        cooldownTurns:
          type: integer
          minimum: 0
        shield:
          type: integer
          minimum: 0
        guarded:
          type: boolean
        visible:
          type: boolean
        alive:
          type: boolean
      required:
        - id
        - team
        - role
        - class
        - policy
        - position
        - hp
        - maxHp
        - moveRange
        - attackRange
        - attackDamage
        - moveSpeed
        - armor
        - visionRange
        - attackCooldown
        - cooldownTurns
        - shield
        - guarded
        - visible
        - alive
    TerrainFeature:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [river, brush, wall, safe-zone]
        position:
          $ref: "#/components/schemas/Point"
        radius:
          type: number
          exclusiveMinimum: 0
        moveMultiplier:
          type: number
          exclusiveMinimum: 0
        blocksVision:
          type: boolean
      required: [id, label, kind, position, radius, moveMultiplier, blocksVision]
    ObjectiveState:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        position:
          $ref: "#/components/schemas/Point"
        radius:
          type: number
          exclusiveMinimum: 0
        blueProgress:
          type: integer
          minimum: 0
        redProgress:
          type: integer
          minimum: 0
        requiredProgress:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [neutral, contested, blue-control, red-control, secured-blue, secured-red]
      required: [id, label, position, radius, blueProgress, redProgress, requiredProgress, status]
    Turret:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        team:
          type: string
          enum: [blue, red]
        lane:
          type: string
          enum: [top, middle, bottom]
        position:
          $ref: "#/components/schemas/Point"
        hp:
          type: integer
          minimum: 0
        maxHp:
          type: integer
          minimum: 1
        alive:
          type: boolean
      required: [id, team, lane, position, hp, maxHp, alive]
    Projectile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        team:
          type: string
          enum: [blue, red]
        sourceUnitId:
          type: string
          description: Empty when a red source is hidden from the browser.
        targetUnitId:
          type: string
          minLength: 1
        position:
          $ref: "#/components/schemas/Point"
        target:
          $ref: "#/components/schemas/Point"
        damage:
          type: integer
          minimum: 1
      required: [id, team, sourceUnitId, targetUnitId, position, target, damage]
    BotControl:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [pending, external-model, deterministic-fallback]
        modelName:
          type: string
          minLength: 1
        modelVersion:
          type: string
          minLength: 1
      required: [source]
    ScenarioMechanic:
      type: object
      additionalProperties: false
      properties:
        elementId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        roleInScenario:
          type: string
          minLength: 1
      required: [elementId, name, description, roleInScenario]
    MechanicBriefing:
      type: object
      additionalProperties: false
      properties:
        mechanics:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScenarioMechanic"
      required: [mechanics]
    LogEntry:
      type: object
      additionalProperties: false
      properties:
        turn:
          type: integer
          minimum: 0
        actor:
          type: string
          enum: [user, ally, enemy, policy, system]
        kind:
          type: string
          minLength: 1
        action:
          type: string
          minLength: 1
        actorId:
          type: string
        targetId:
          type: string
        value:
          type: integer
        message:
          type: string
          minLength: 1
      required: [turn, actor, kind, action, message]
    ReferenceOutcome:
      type: object
      additionalProperties: false
      properties:
        firstAction:
          $ref: "#/components/schemas/Action"
        status:
          type: string
          enum: [won, lost]
        turns:
          type: integer
          minimum: 1
        advantage:
          type: number
          minimum: 0
          maximum: 1
        outcomeReason:
          type: string
          minLength: 1
        keyEvents:
          type: array
          items:
            type: string
      required: [firstAction, status, turns, advantage, outcomeReason, keyEvents]
    BestCaseAlternative:
      type: object
      additionalProperties: false
      properties:
        action:
          $ref: "#/components/schemas/Action"
        status:
          type: string
          enum: [won, lost]
        turns:
          type: integer
          minimum: 1
        advantage:
          type: number
          minimum: 0
          maximum: 1
        outcomeReason:
          type: string
          minLength: 1
      required: [action, status, turns, advantage, outcomeReason]
    BestCaseStep:
      type: object
      additionalProperties: false
      properties:
        turn:
          type: integer
          minimum: 1
        action:
          $ref: "#/components/schemas/Action"
        reason:
          type: string
          minLength: 1
        advantageBefore:
          type: number
          minimum: 0
          maximum: 1
        advantageAfter:
          type: number
          minimum: 0
          maximum: 1
        keyEvents:
          type: array
          items:
            type: string
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/BestCaseAlternative"
      required: [turn, action, reason, advantageBefore, advantageAfter, keyEvents, alternatives]
    BestCaseLine:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [won, lost]
        turns:
          type: integer
          minimum: 1
        advantage:
          type: number
          minimum: 0
          maximum: 1
        outcomeReason:
          type: string
          minLength: 1
        method:
          type: string
          minLength: 1
        steps:
          type: array
          items:
            $ref: "#/components/schemas/BestCaseStep"
      required: [status, turns, advantage, outcomeReason, method, steps]
    Session:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        momentId:
          type: string
          minLength: 1
        controlledUnitId:
          type: string
          minLength: 1
        scenarioGoal:
          type: string
          minLength: 1
        mechanicBriefing:
          $ref: "#/components/schemas/MechanicBriefing"
        turn:
          type: integer
          minimum: 0
        maxTurns:
          type: integer
          minimum: 1
          maximum: 20
        status:
          type: string
          enum: [active, won, lost]
        outcomeReason:
          type: string
          minLength: 1
        advantage:
          type: number
          minimum: 0
          maximum: 1
        escapeProgress:
          type: integer
          minimum: 0
        escapeTurnsRequired:
          type: integer
          minimum: 0
        visibleEnemyCount:
          type: integer
          minimum: 0
          maximum: 5
        unknownEnemyCount:
          type: integer
          minimum: 0
          maximum: 5
        visionLimited:
          type: boolean
        objective:
          $ref: "#/components/schemas/ObjectiveState"
        terrain:
          type: array
          items:
            $ref: "#/components/schemas/TerrainFeature"
        turrets:
          type: array
          description: Six full-map turrets, one per lane for each team.
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/Turret"
        projectiles:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/Projectile"
        projectileCharges:
          type: integer
          minimum: 0
          maximum: 2
        projectileAvailable:
          type: boolean
        dodgeCharges:
          type: integer
          minimum: 0
          maximum: 2
        dodgeAvailable:
          type: boolean
        botControl:
          $ref: "#/components/schemas/BotControl"
        lastReferenceAction:
          $ref: "#/components/schemas/Action"
        referenceReason:
          type: string
          minLength: 1
        referenceOutcomes:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceOutcome"
        bestCase:
          $ref: "#/components/schemas/BestCaseLine"
        legalActions:
          type: array
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ActionType"
        units:
          type: array
          minItems: 5
          maxItems: 10
          items:
            $ref: "#/components/schemas/Unit"
        log:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        debrief:
          type: array
          items:
            type: string
      required:
        - id
        - momentId
        - controlledUnitId
        - scenarioGoal
        - turn
        - maxTurns
        - status
        - advantage
        - escapeProgress
        - escapeTurnsRequired
        - visibleEnemyCount
        - unknownEnemyCount
        - visionLimited
        - terrain
        - turrets
        - projectiles
        - projectileCharges
        - projectileAvailable
        - dodgeCharges
        - dodgeAvailable
        - botControl
        - legalActions
        - units
        - log
    BotSnapshotUnit:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        team:
          type: string
          enum: [blue, red]
        role:
          type: string
          minLength: 1
        class:
          $ref: "#/components/schemas/UnitClass"
        fallbackPolicy:
          type: string
          enum: [controlled, support, protector, aggressive, skirmisher]
        position:
          $ref: "#/components/schemas/Point"
        hp:
          type: integer
          minimum: 0
        maxHp:
          type: integer
          minimum: 1
        moveRange:
          type: number
          minimum: 0
          maximum: 100
        attackRange:
          type: number
          minimum: 0
          maximum: 100
        cooldownTurns:
          type: integer
          minimum: 0
        shield:
          type: integer
          minimum: 0
        guarded:
          type: boolean
        visible:
          type: boolean
        alive:
          type: boolean
      required:
        - id
        - team
        - role
        - class
        - fallbackPolicy
        - position
        - hp
        - maxHp
        - moveRange
        - attackRange
        - cooldownTurns
        - shield
        - guarded
        - visible
        - alive
    BotModelRequest:
      type: object
      additionalProperties: false
      description: Privileged authoritative snapshot; never expose it to the browser.
      properties:
        schemaVersion:
          type: string
          const: "2.0"
        stateScope:
          type: string
          const: authoritative_server_state
        sessionId:
          type: string
          minLength: 1
        momentId:
          type: string
          minLength: 1
        turn:
          type: integer
          minimum: 1
        mapBounds:
          $ref: "#/components/schemas/MapBounds"
        controlledUnitId:
          type: string
          minLength: 1
        legalActions:
          type: array
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ActionType"
        objective:
          $ref: "#/components/schemas/ObjectiveState"
        projectiles:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/Projectile"
        units:
          type: array
          minItems: 2
          maxItems: 64
          items:
            $ref: "#/components/schemas/BotSnapshotUnit"
      required:
        - schemaVersion
        - stateScope
        - sessionId
        - momentId
        - turn
        - mapBounds
        - controlledUnitId
        - legalActions
        - projectiles
        - units
    BotActionSuggestion:
      type: object
      additionalProperties: false
      properties:
        unitId:
          type: string
          minLength: 1
        action:
          $ref: "#/components/schemas/Action"
      required: [unitId, action]
    BotModelResponse:
      type: object
      additionalProperties: false
      description: Exactly one action per live unit other than controlledUnitId.
      properties:
        actions:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/BotActionSuggestion"
      required: [actions]
