openapi: 3.1.0
info:
  title: Playable Replays API
  version: 0.3.0
  description: |
    Deterministic tactical replay prototype API. An optional position-model
    connector may suggest next-frame positions for live non-player units, but
    the simulator remains authoritative over movement limits, physics, damage,
    and outcomes.
servers:
  - url: http://127.0.0.1:8080
security: []
paths:
  /healthz:
    get:
      summary: Check API health
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: ok}
                required: [status]
  /api/v1/moments:
    get:
      summary: List playable replay moments
      operationId: listMoments
      responses:
        "200":
          description: Available replay moments
          content:
            application/json:
              schema:
                type: object
                properties:
                  moments:
                    type: array
                    items: {$ref: "#/components/schemas/MomentSummary"}
                required: [moments]
  /api/v1/sessions:
    post:
      summary: Create a replay session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                momentId: {type: string}
              required: [momentId]
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Get current replay session state
      operationId: getSession
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/sessions/{id}/turns:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Resolve one replay turn
      operationId: takeTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                action: {$ref: "#/components/schemas/Action"}
              required: [action]
      responses:
        "200":
          description: Resolved turn
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/v1/sessions/{id}/reset:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Reset a replay session
      operationId: resetSession
      responses:
        "200":
          description: Reset session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "404": {$ref: "#/components/responses/Error"}
webhooks:
  positionModelTurn:
    post:
      operationId: suggestNonPlayerPositions
      summary: Suggest teammate and opponent positions for the next frame
      description: |
        When `POSITION_MODEL_URL` (or its deprecated `OPPONENT_MODEL_URL`
        alias) is configured, the API sends this request once per resolved
        user turn. `turn` is the one-based index of the next frame being
        resolved. The response is advisory and may target any live unit except
        `controlledUnitId`, including the player's AI-controlled teammates.
        Unknown, controlled, dead, duplicate, non-finite, or out-of-bounds
        suggestions reject the complete response. Valid targets are clamped
        to server-owned class movement limits. Omitted allies remain in place;
        omitted opponents use deterministic chase behavior. A timeout,
        transport failure, malformed response, or invalid suggestion activates
        the same deterministic fallback without partially applying the response.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PositionModelRequest"}
      responses:
        "200":
          description: Advisory positions returned; simulator validation still applies
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PositionModelResponse"}
        default:
          description: Any non-200 response activates the deterministic fallback policy
components:
  schemas:
    Point:
      type: object
      additionalProperties: false
      properties:
        x: {type: number, minimum: 0, maximum: 100}
        y: {type: number, minimum: 0, maximum: 100}
      required: [x, y]
    Action:
      type: object
      additionalProperties: false
      properties:
        type: {type: string, enum: [move, hold, contest, retreat, dodge, outplay]}
        target: {$ref: "#/components/schemas/Point"}
      required: [type]
    Unit:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        team: {type: string, enum: [blue, red]}
        role: {type: string}
        class:
          type: string
          enum: [tank, fighter, marksman, mage, support, assassin]
        position: {$ref: "#/components/schemas/Point"}
        hp: {type: integer, minimum: 0, maximum: 160}
        maxHp: {type: integer, enum: [90, 95, 100, 110, 125, 160]}
        moveRange:
          type: number
          minimum: 0
          maximum: 100
          description: Maximum map units this class can move in one frame.
        attackRange:
          type: number
          minimum: 0
          maximum: 100
          description: Class attack radius in map units.
        cooldownTurns: {type: integer, minimum: 0}
        visible: {type: boolean}
        alive: {type: boolean}
      required: [id, team, role, class, position, hp, maxHp, moveRange, attackRange, cooldownTurns, visible, alive]
      allOf:
        - if: {properties: {class: {const: tank}}, required: [class]}
          then: {properties: {hp: {type: integer, maximum: 160}, maxHp: {type: integer, const: 160}, moveRange: {type: number, const: 7}, attackRange: {type: number, const: 10}}}
        - if: {properties: {class: {const: fighter}}, required: [class]}
          then: {properties: {hp: {type: integer, maximum: 125}, maxHp: {type: integer, const: 125}, moveRange: {type: number, const: 10}, attackRange: {type: number, const: 14}}}
        - if: {properties: {class: {const: marksman}}, required: [class]}
          then: {properties: {hp: {type: integer, maximum: 90}, maxHp: {type: integer, const: 90}, moveRange: {type: number, const: 11}, attackRange: {type: number, const: 28}}}
        - if: {properties: {class: {const: mage}}, required: [class]}
          then: {properties: {hp: {type: integer, maximum: 95}, maxHp: {type: integer, const: 95}, moveRange: {type: number, const: 9}, attackRange: {type: number, const: 24}}}
        - if: {properties: {class: {const: support}}, required: [class]}
          then: {properties: {hp: {type: integer, maximum: 110}, maxHp: {type: integer, const: 110}, moveRange: {type: number, const: 8}, attackRange: {type: number, const: 20}}}
        - if: {properties: {class: {const: assassin}}, required: [class]}
          then: {properties: {hp: {type: integer, maximum: 100}, maxHp: {type: integer, const: 100}, moveRange: {type: number, const: 13}, attackRange: {type: number, const: 12}}}
    Session:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        momentId: {type: string}
        controlledUnitId: {type: string}
        turn: {type: integer}
        maxTurns: {type: integer}
        status: {type: string, enum: [active, won, lost]}
        score: {type: integer}
        winProbability: {type: number, minimum: 0, maximum: 1}
        referenceAction: {$ref: "#/components/schemas/Action"}
        legalActions:
          type: array
          items: {type: string, enum: [move, hold, contest, retreat, dodge, outplay]}
        units:
          type: array
          items: {$ref: "#/components/schemas/Unit"}
        log:
          type: array
          items:
            type: object
            properties:
              turn: {type: integer}
              actor: {type: string, enum: [user, policy]}
              action:
                type: string
                description: User entries use a legal action type; policy entries describe non-player movement and opponent combat.
              message: {type: string}
            required: [turn, actor, action, message]
      required: [id, momentId, controlledUnitId, turn, maxTurns, status, score, winProbability, referenceAction, legalActions, units, log]
    MomentSummary:
      type: object
      properties:
        id: {type: string}
        slug: {type: string}
        title: {type: string}
        description: {type: string}
        map: {type: string}
        reasonTags:
          type: array
          items: {type: string}
        highlightScore: {type: number, minimum: 0, maximum: 1}
      required: [id, slug, title, description, map, reasonTags, highlightScore]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
          required: [code, message]
      required: [error]
    MapBounds:
      type: object
      additionalProperties: false
      properties:
        minX: {type: number}
        maxX: {type: number}
        minY: {type: number}
        maxY: {type: number}
      required: [minX, maxX, minY, maxY]
    PositionModelRequest:
      type: object
      additionalProperties: false
      description: Privileged server-side snapshot sent to the optional position model.
      properties:
        schemaVersion:
          type: string
          const: "1.1"
          description: Version of the non-player position connector contract.
        stateScope:
          type: string
          const: authoritative_server_state
          description: Marks this as privileged server state, not the browser view.
        sessionId: {type: string, minLength: 1}
        momentId: {type: string, minLength: 1}
        turn:
          type: integer
          minimum: 1
          description: One-based index of the next frame being resolved.
        mapBounds: {$ref: "#/components/schemas/MapBounds"}
        controlledUnitId: {type: string, minLength: 1}
        units:
          type: array
          minItems: 2
          maxItems: 64
          items: {$ref: "#/components/schemas/PositionModelSnapshotUnit"}
      required: [schemaVersion, stateScope, sessionId, momentId, turn, mapBounds, controlledUnitId, units]
    PositionModelSnapshotUnit:
      type: object
      additionalProperties: false
      description: Bounded authoritative unit state sent to the trusted model connector.
      properties:
        id: {type: string, minLength: 1}
        team: {type: string, enum: [blue, red]}
        role: {type: string, minLength: 1}
        class:
          type: string
          enum: [tank, fighter, marksman, mage, support, assassin]
        position: {$ref: "#/components/schemas/Point"}
        hp: {type: integer, minimum: 0}
        maxHp: {type: integer, minimum: 1}
        moveRange: {type: number, minimum: 0, maximum: 100}
        attackRange: {type: number, minimum: 0, maximum: 100}
        cooldownTurns: {type: integer, minimum: 0}
        visible: {type: boolean}
        alive: {type: boolean}
      required: [id, team, role, class, position, hp, maxHp, moveRange, attackRange, cooldownTurns, visible, alive]
    PositionSuggestion:
      type: object
      additionalProperties: false
      properties:
        unitId: {type: string, minLength: 1}
        position: {$ref: "#/components/schemas/Point"}
      required: [unitId, position]
    PositionModelResponse:
      type: object
      additionalProperties: false
      description: |
        Advisory next-frame targets for live non-controlled units. Omitted
        teammates hold position and omitted opponents use deterministic chase.
      properties:
        positions:
          type: array
          maxItems: 64
          items: {$ref: "#/components/schemas/PositionSuggestion"}
      required: [positions]
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
